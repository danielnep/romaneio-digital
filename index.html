<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romaneio PRO - Farmax</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --azul: #0056b3; --verde: #198754; --vermelho: #dc3545; --fundo: #f0f2f5; --texto: #333; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--fundo); margin: 0; padding: 15px; color: var(--texto); }
        .app-container { background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 20px; max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: var(--azul); font-weight: 700; margin-top: 0; font-size: 22px; }
        .tela { display: none; } .tela.ativa { display: block; }
        button { width: 100%; padding: 14px; font-size: 14px; font-weight: 600; font-family: 'Poppins'; border: none; border-radius: 8px; margin-bottom: 12px; cursor: pointer; color: white; }
        .btn-primario { background: #0056b3; } .btn-sucesso { background: #198754; } .btn-alerta { background: #ffc107; color: #000; } .btn-ocr { background: #6f42c1; font-size: 12px; }
        label { font-weight: 600; display: block; margin-top: 10px; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 13px; font-family: 'Poppins'; }
        .flex-row { display: flex; gap: 10px; } .flex-row > div { flex: 1; }
        #resultadoOcr { font-size: 12px; background: #eee; padding: 10px; border-radius: 6px; margin-top: 5px; display: none; text-align: center; font-weight: 600; }
        .card-veiculo { border: 1px solid #ccc; padding: 12px; border-radius: 8px; margin-bottom: 10px; background: #fff; border-left: 5px solid var(--azul); }
    </style>
</head>
<body>
<div class="app-container">
    <h2>Vistoria Digital</h2>
    
    <div id="telaInicio" class="tela ativa">
        <label>Sua Portaria:</label>
        <select id="portariaPainel" style="margin-bottom: 20px;">
            <option value="P1">Portaria 1</option>
            <option value="P2">Portaria 2</option>
            <option value="P3">Portaria 3</option>
            <option value="Tanques">Tanques</option>
        </select>
        <button class="btn-sucesso" onclick="iniciarEntrada()">📥 NOVA ENTRADA</button>
        <button class="btn-alerta" onclick="abrirSaida()">🚛 VER PÁTIO (DAR SAÍDA)</button>
    </div>

    <div id="telaEntrada" class="tela">
        <h3 style="text-align: center; color: var(--azul); margin-top: 0;">Nova Entrada</h3>
        
        <label>📄 Preenchimento Inteligente (Câmera)</label>
        <div class="flex-row">
            <div><button type="button" class="btn-ocr" onclick="document.getElementById('capturaDoc').click()">📸 LER RG/CNH</button></div>
            <div><button type="button" class="btn-ocr" onclick="document.getElementById('capturaPlaca').click()">📸 LER PLACA</button></div>
        </div>
        <input type="file" id="capturaDoc" accept="image/*" capture="environment" style="display:none" onchange="processarOcr(event, 'doc')">
        <input type="file" id="capturaPlaca" accept="image/*" capture="environment" style="display:none" onchange="processarOcr(event, 'placa')">
        <div id="resultadoOcr"></div>

        <form id="formEntrada">
            <label>Empresa *</label>
            <input type="text" id="empresa" required>

            <label>Tipo de Veículo *</label>
            <select id="tipoVeiculo" required>
                <option value="Carreta/Caminhão" selected>Carreta / Caminhão</option>
                <option value="Pequeno">Veículo Pequeno</option>
            </select>

            <label>Placa do Baú / Única *</label>
            <input type="text" id="placaBau" required style="text-transform: uppercase;">

            <label>Motorista *</label>
            <input type="text" id="motorista" required>

            <div class="flex-row">
                <div><label>RG</label><input type="text" id="rg"></div>
                <div><label>CNH</label><input type="text" id="cnh"></div>
            </div>

            <label>GPS *</label>
            <input type="text" id="localizacao" readonly required>

            <label>Observações</label>
            <textarea id="observacoes" rows="2"></textarea>

            <label>📸 Foto c/ Plaquinha (Obrigatório) *</label>
            <button type="button" style="background:#333;" onclick="document.getElementById('capturaSelfie').click()">📷 BATER FOTO DO MOTORA</button>
            <input type="file" id="capturaSelfie" accept="image/*" capture="user" style="display:none" onchange="gerarCarimbo(event)">
            
            <img id="previewCarimbo" style="width: 100%; border-radius: 8px; margin-top: 10px; display: none;">
            <input type="hidden" id="fotoCarimbadaBase64" required>
            <canvas id="canvasCarimbo" style="display:none;"></canvas>

            <button type="submit" class="btn-sucesso" id="btnEnviar" onclick="salvarEntrada(event)" style="margin-top: 20px;">🚀 SALVAR NA NUVEM</button>
            <button type="button" class="btn-alerta" style="background: #ccc;" onclick="voltar()">Cancelar</button>
        </form>
    </div>

    <div id="telaSaida" class="tela">
        <h3 style="text-align: center; color: var(--vermelho);">Veículos no Pátio</h3>
        <div id="listaPatio"></div>
        <button type="button" class="btn-alerta" style="background: #ccc; margin-top: 15px;" onclick="voltar()">Voltar</button>
    </div>
</div>

<script>
    const urlApp = "https://script.google.com/macros/s/AKfycbyFgCjb1DRp_-TYMcQ6lqow_JlU9HWUvJpVULi36Syvb2POcYXjN7Cc-8gAbYumhkUS_w/exec";

    function mostrarTela(id) { document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa')); document.getElementById(id).classList.add('ativa'); }
    function voltar() { document.getElementById('formEntrada').reset(); document.getElementById('previewCarimbo').style.display = 'none'; mostrarTela('telaInicio'); }

    function iniciarEntrada() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                document.getElementById('localizacao').value = p.coords.latitude + ", " + p.coords.longitude;
                mostrarTela('telaEntrada');
            }, () => alert("Ative o GPS do celular!"), { enableHighAccuracy: true });
        }
    }

    async function processarOcr(e, tipo) {
        const f = e.target.files[0]; if(!f) return;
        const div = document.getElementById('resultadoOcr'); 
        div.style.display = 'block'; 
        div.innerHTML = '⏳ Lendo imagem... Fique firme.';
        
        try {
            const ret = await Tesseract.recognize(f, 'por'); 
            const txtBruto = ret.data.text.toUpperCase();
            
            if(tipo === 'placa') {
                // Tira tudo que não é letra e número pra facilitar a vida do regex
                const txtLimpo = txtBruto.replace(/[^A-Z0-9]/g, '');
                // Padrão Brasil antigo ou Mercosul (3 letras + 1 número + 1 letra/numero + 2 números) = 7 dígitos
                const m = txtLimpo.match(/[A-Z]{3}[0-9][A-Z0-9][0-9]{2}/);
                if(m) { 
                    document.getElementById('placaBau').value = m[0]; 
                    div.innerHTML = '✅ Placa preenchida!'; 
                } else {
                    div.innerHTML = '⚠️ Não achou placa visível. Digite na mão.';
                }
            } else {
                const rg = txtBruto.match(/\b\d{1,2}\.?\d{3}\.?\d{3}-?[0-9X]\b/); 
                const cnh = txtBruto.match(/\b\d{11}\b/);
                if(rg) document.getElementById('rg').value = rg[0]; 
                if(cnh) document.getElementById('cnh').value = cnh[0];
                div.innerHTML = '✅ Doc analisado! Verifique os campos.';
            }
            setTimeout(() => div.style.display = 'none', 4000);
        } catch(err) { 
            div.innerHTML = '❌ Erro no sistema de leitura. Digite manualmente.'; 
            setTimeout(() => div.style.display = 'none', 4000);
        }
    }

    function gerarCarimbo(e) {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
                const cv = document.getElementById('canvasCarimbo'); const ctx = cv.getContext('2d');
                const sc = 800 / img.width; cv.width = 800; cv.height = img.height * sc;
                ctx.drawImage(img, 0, 0, cv.width, cv.height);
                ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, cv.height - 200, cv.width, 200);
                ctx.fillStyle = "#FFF"; ctx.font = "bold 16px Arial"; let y = cv.height - 170;
                
                ctx.fillText(`EU, ${document.getElementById('motorista').value.toUpperCase()}, CONFIRMO ESTE ROMANEIO.`, 15, y); ctx.font = "14px Arial"; y+=25;
                ctx.fillText(`EMPRESA: ${document.getElementById('empresa').value.toUpperCase()} | PORTARIA: ${document.getElementById('portariaPainel').value}`, 15, y); y+=25;
                // Retirei a placa cavalo daqui também
                ctx.fillText(`VEÍCULO: ${document.getElementById('tipoVeiculo').value.toUpperCase()} | PLACA: ${document.getElementById('placaBau').value.toUpperCase()}`, 15, y); y+=25;
                ctx.fillText(`RG: ${document.getElementById('rg').value} | CNH: ${document.getElementById('cnh').value}`, 15, y); y+=25;
                ctx.fillText(`DATA/HORA: ${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR')} | GPS: ${document.getElementById('localizacao').value}`, 15, y);
                
                const b64 = cv.toDataURL('image/jpeg', 0.6);
                document.getElementById('fotoCarimbadaBase64').value = b64; 
                document.getElementById('previewCarimbo').src = b64; 
                document.getElementById('previewCarimbo').style.display = 'block';
            }; img.src = ev.target.result;
        }; r.readAsDataURL(f);
    }

    function salvarEntrada(e) {
        e.preventDefault(); if(!document.getElementById('formEntrada').checkValidity()) { document.getElementById('formEntrada').reportValidity(); return; }
        document.getElementById('btnEnviar').innerText = "⏳ ENVIANDO PRO DIEGO..."; document.getElementById('btnEnviar').disabled = true;
        const obj = {
            idLocal: Date.now().toString(), tipoRegistro: "Entrada", portaria: document.getElementById('portariaPainel').value,
            empresa: document.getElementById('empresa').value, tipoVeiculo: document.getElementById('tipoVeiculo').value,
            placaCavalo: "", /* Mantive vazio pro Google não errar a coluna */
            placaBau: document.getElementById('placaBau').value,
            motorista: document.getElementById('motorista').value, rg: document.getElementById('rg').value, cnh: document.getElementById('cnh').value,
            localizacao: document.getElementById('localizacao').value, observacoes: document.getElementById('observacoes').value,
            fotoValidacao: document.getElementById('fotoCarimbadaBase64').value, dataAtual: new Date().toLocaleDateString('pt-BR'), horaAtual: new Date().toLocaleTimeString('pt-BR')
        };
        let p = JSON.parse(localStorage.getItem('patioApp')) || []; p.push(obj); localStorage.setItem('patioApp', JSON.stringify(p));
        enviar(obj, "Entrada");
    }

    function abrirSaida() {
        const p = JSON.parse(localStorage.getItem('patioApp')) || []; const port = document.getElementById('portariaPainel').value;
        const lista = document.getElementById('listaPatio'); const filt = p.filter(v => v.portaria === port);
        if(filt.length === 0) lista.innerHTML = '<p style="text-align:center;">Pátio vazio.</p>';
        else {
            lista.innerHTML = '';
            filt.forEach(v => lista.innerHTML += `<div class="card-veiculo"><strong>${v.empresa}</strong><br>Mot: ${v.motorista}<br>Placa: ${v.placaBau}<br><small>Entrou: ${v.horaAtual}</small><br><button class="btn-sucesso" style="margin-top:10px;" onclick="darSaida('${v.idLocal}')">✅ REGISTRAR SAÍDA</button></div>`);
        }
        mostrarTela('telaSaida');
    }

    function darSaida(id) {
        let p = JSON.parse(localStorage.getItem('patioApp')) || [];
        localStorage.setItem('patioApp', JSON.stringify(p.filter(v => v.idLocal !== id)));
        enviar({ idLocal: id, tipoRegistro: "Saida", dataAtual: new Date().toLocaleDateString('pt-BR'), horaAtual: new Date().toLocaleTimeString('pt-BR') }, "Saída");
        abrirSaida();
    }

    function enviar(obj, tipo) {
        fetch(urlApp, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(obj) }).then(() => {
            alert(`✅ ${tipo} registrada! Pode conferir lá.`);
            if(tipo === "Entrada") { document.getElementById('btnEnviar').innerText = "🚀 SALVAR NA NUVEM"; document.getElementById('btnEnviar').disabled = false; voltar(); }
        }).catch(() => alert("Sem internet! Salvo no celular, envio depois."));
    }
</script>
</body>
</html>
