<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romaneio PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --azul: #0056b3; --vermelho: #dc3545; --verde: #198754; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .app-container { background: white; border-radius: 16px; padding: 25px; max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: var(--azul); margin-top: 0; }
        label { font-weight: 600; display: block; margin-top: 15px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Poppins'; }
        button { width: 100%; padding: 15px; font-weight: bold; border: none; border-radius: 8px; margin-top: 15px; color: white; cursor: pointer; }
        .btn-ocr { background: #6f42c1; } .btn-sucesso { background: var(--verde); } .btn-alerta { background: #ffc107; color: #000; }
        .tela { display: none; } .tela.ativa { display: block; }
        #resultadoOcr { font-size: 12px; background: #eee; padding: 10px; display: none; border-radius: 5px; margin-top: 5px; }
        .escondido { display: none !important; }
        .card-veiculo { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid var(--azul); }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Romaneio Digital PRO</h2>

    <!-- TELA 1: INÍCIO -->
    <div id="telaInicio" class="tela ativa">
        <label>Sua Portaria:</label>
        <select id="portariaPainel">
            <option value="P1">Portaria 1</option>
            <option value="P2">Portaria 2</option>
            <option value="P3">Portaria 3</option>
            <option value="Tanques">Tanques</option>
        </select>
        <button class="btn-sucesso" onclick="mostrarTela('telaEntrada'); pegarGPS();">📥 REGISTRAR ENTRADA</button>
        <button class="btn-alerta" onclick="abrirSaida()">🚛 VER VEÍCULOS (DAR SAÍDA)</button>
    </div>

    <!-- TELA 2: ENTRADA -->
    <div id="telaEntrada" class="tela">
        
        <!-- OCR BOTOES -->
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button type="button" class="btn-ocr" onclick="document.getElementById('capturaDoc').click()">📸 LER DOC (RG/CNH)</button>
            <button type="button" class="btn-ocr" onclick="document.getElementById('capturaPlaca').click()">📸 LER PLACA</button>
        </div>
        <input type="file" id="capturaDoc" accept="image/*" capture="environment" style="display:none" onchange="lerOcr(event, 'doc')">
        <input type="file" id="capturaPlaca" accept="image/*" capture="environment" style="display:none" onchange="lerOcr(event, 'placa')">
        <div id="resultadoOcr"></div>

        <form id="formEntrada">
            <label>Empresa</label>
            <input type="text" id="empresa" required>

            <label>Tipo de Veículo</label>
            <select id="tipoVeiculo" required onchange="ajustarPlacas()">
                <option value="Pequeno">Pequeno</option>
                <option value="Carreta/Caminhão" selected>Carreta / Caminhão</option>
            </select>

            <label id="lblCavalo">Placa Cavalo</label>
            <input type="text" id="placaCavalo" style="text-transform:uppercase;">
            
            <label>Placa Baú / Única *</label>
            <input type="text" id="placaBau" required style="text-transform:uppercase;">

            <label>Motorista</label>
            <input type="text" id="motorista" required>
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1"><label>RG</label><input type="text" id="rg"></div>
                <div style="flex:1"><label>CNH</label><input type="text" id="cnh"></div>
            </div>

            <label>GPS (Automático)</label>
            <input type="text" id="localizacao" readonly required>

            <label>Observações / Vistoria</label>
            <textarea id="observacoes"></textarea>

            <!-- CANVAS / SELFIE -->
            <label>📸 MUGSHOT (Selfie c/ Plaquinha) *</label>
            <button type="button" style="background:#333; margin-top:0;" onclick="document.getElementById('capturaSelfie').click()">📷 BATER FOTO DO MOTORISTA</button>
            <input type="file" id="capturaSelfie" accept="image/*" capture="user" style="display:none" onchange="gerarCarimbo(event)">
            
            <img id="previewCarimbo" style="width:100%; border-radius:10px; margin-top:10px; display:none;">
            <input type="hidden" id="fotoCarimbadaBase64" required>
            <canvas id="canvasCarimbo" style="display:none;"></canvas>

            <button type="submit" class="btn-sucesso" id="btnEnviar" onclick="processarEntrada(event)">🚀 SALVAR ENTRADA</button>
            <button type="button" class="btn-alerta" style="background:#ccc" onclick="voltar()">Cancelar</button>
        </form>
    </div>

    <!-- TELA 3: SAÍDAS -->
    <div id="telaSaida" class="tela">
        <h3 style="text-align: center;">Dar Saída</h3>
        <div id="listaSaida"></div>
        <button type="button" style="background:#ccc; color:#000;" onclick="voltar()">Voltar</button>
    </div>
</div>

<script>
    const urlApp = "SUA_URL_DO_APP_SCRIPT_AQUI"; 

    function mostrarTela(t) { document.querySelectorAll('.tela').forEach(el => el.classList.remove('ativa')); document.getElementById(t).classList.add('ativa'); }
    function voltar() { document.getElementById('formEntrada').reset(); document.getElementById('previewCarimbo').style.display='none'; mostrarTela('telaInicio'); }

    function ajustarPlacas() {
        const t = document.getElementById('tipoVeiculo').value;
        const c = document.getElementById('placaCavalo'); const l = document.getElementById('lblCavalo');
        if(t === 'Pequeno') { c.classList.add('escondido'); l.classList.add('escondido'); c.value = ""; } 
        else { c.classList.remove('escondido'); l.classList.remove('escondido'); }
    }

    function pegarGPS() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => document.getElementById('localizacao').value = p.coords.latitude + ", " + p.coords.longitude);
        }
    }

    async function lerOcr(e, tipo) {
        const file = e.target.files[0]; if(!file) return;
        const div = document.getElementById('resultadoOcr'); div.style.display='block'; div.innerHTML = '⏳ Lendo imagem...';
        try {
            const w = await Tesseract.createWorker('por'); const ret = await w.recognize(file); const txt = ret.data.text.toUpperCase();
            
            if(tipo === 'placa') {
                const p = txt.match(/[A-Z]{3}[- ]?[0-9][A-Z0-9][0-9]{2}/);
                if(p) { document.getElementById('placaBau').value = p[0].replace(' ','-'); div.innerHTML='✅ Placa capturada!'; }
                else div.innerHTML='⚠️ Placa não reconhecida.';
            } else {
                const rg = txt.match(/\d{2}\.?\d{3}\.?\d{3}-?[0-9X]/);
                const cnh = txt.match(/\b\d{11}\b/);
                if(rg) document.getElementById('rg').value = rg[0];
                if(cnh) document.getElementById('cnh').value = cnh[0];
                div.innerHTML='✅ Documento lido! Revise os campos.';
            }
            await w.terminate(); setTimeout(() => div.style.display='none', 4000);
        } catch(err) { div.innerHTML = '❌ Erro no OCR.'; }
    }

    function gerarCarimbo(e) {
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('canvasCarimbo'); const ctx = canvas.getContext('2d');
                const scale = 800 / img.width; canvas.width = 800; canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, canvas.height - 240, canvas.width, 240);
                ctx.fillStyle = "#FFF"; ctx.textAlign = "left"; ctx.font = "bold 18px Arial";
                
                let y = canvas.height - 210;
                ctx.fillText(`EU, ${document.getElementById('motorista').value.toUpperCase()}, CONFIRMO ESTE ROMANEIO DIGITAL.`, 20, y);
                ctx.font = "16px Arial"; y+=30;
                ctx.fillText(`EMPRESA: ${document.getElementById('empresa').value.toUpperCase()} | PORTARIA: ${document.getElementById('portariaPainel').value}`, 20, y); y+=30;
                ctx.fillText(`VEÍCULO: ${document.getElementById('tipoVeiculo').value.toUpperCase()} | PLACA BAÚ: ${document.getElementById('placaBau').value.toUpperCase()} | CAVALO: ${document.getElementById('placaCavalo').value.toUpperCase()}`, 20, y); y+=30;
                ctx.fillText(`RG: ${document.getElementById('rg').value} | CNH: ${document.getElementById('cnh').value}`, 20, y); y+=30;
                ctx.fillText(`GPS: ${document.getElementById('localizacao').value}`, 20, y); y+=30;
                ctx.fillText(`DATA/HORA: ${new Date().toLocaleDateString('pt-BR')} - ${new Date().toLocaleTimeString('pt-BR')}`, 20, y);
                
                const b64 = canvas.toDataURL('image/jpeg', 0.6);
                document.getElementById('fotoCarimbadaBase64').value = b64;
                document.getElementById('previewCarimbo').src = b64;
                document.getElementById('previewCarimbo').style.display = 'block';
            }; img.src = ev.target.result;
        }; reader.readAsDataURL(f);
    }

    function processarEntrada(e) {
        e.preventDefault(); if(!document.getElementById('formEntrada').checkValidity()) { document.getElementById('formEntrada').reportValidity(); return; }
        
        document.getElementById('btnEnviar').innerText = "⏳ ENVIANDO..."; document.getElementById('btnEnviar').disabled = true;
        
        const obj = {
            idLocal: Date.now().toString(), tipoRegistro: "Entrada",
            portaria: document.getElementById('portariaPainel').value,
            empresa: document.getElementById('empresa').value,
            tipoVeiculo: document.getElementById('tipoVeiculo').value,
            placaCavalo: document.getElementById('placaCavalo').value,
            placaBau: document.getElementById('placaBau').value,
            motorista: document.getElementById('motorista').value,
            rg: document.getElementById('rg').value, cnh: document.getElementById('cnh').value,
            localizacao: document.getElementById('localizacao').value,
            observacoes: document.getElementById('observacoes').value,
            fotoValidacao: document.getElementById('fotoCarimbadaBase64').value,
            dataAtual: new Date().toLocaleDateString('pt-BR'), horaAtual: new Date().toLocaleTimeString('pt-BR')
        };

        let aq = JSON.parse(localStorage.getItem('filaPátio')) || [];
        aq.push(obj); localStorage.setItem('filaPátio', JSON.stringify(aq));

        fetch(urlApp, { method: 'POST', body: new URLSearchParams(obj) })
        .then(() => { alert("✅ Entrada na Planilha!"); document.getElementById('btnEnviar').disabled = false; document.getElementById('btnEnviar').innerText = "🚀 SALVAR ENTRADA"; voltar(); })
        .catch(() => alert("Salvou offline!"));
    }

    function abrirSaida() {
        const aq = JSON.parse(localStorage.getItem('filaPátio')) || [];
        const port = document.getElementById('portariaPainel').value;
        const lista = document.getElementById('listaSaida'); lista.innerHTML = '';
        
        const filt = aq.filter(x => x.portaria === port);
        if(filt.length === 0) { lista.innerHTML = '<p>Nenhum caminhão no pátio.</p>'; }
        
        filt.forEach(c => {
            lista.innerHTML += `<div class="card-veiculo">
                <strong>${c.empresa}</strong><br>Mot: ${c.motorista} | Baú: ${c.placaBau}<br>Entrou: ${c.horaAtual}<br>
                <button class="btn-sucesso" onclick="registrarSaida('${c.idLocal}')">✅ REGISTRAR SAÍDA</button>
            </div>`;
        });
        mostrarTela('telaSaida');
    }

    function registrarSaida(id) {
        let aq = JSON.parse(localStorage.getItem('filaPátio')) || [];
        const dataSaida = new Date().toLocaleDateString('pt-BR');
        const horaSaida = new Date().toLocaleTimeString('pt-BR');
        
        const obj = { idLocal: id, tipoRegistro: "Saida", dataAtual: dataSaida, horaAtual: horaSaida };
        localStorage.setItem('filaPátio', JSON.stringify(aq.filter(x => x.idLocal !== id)));
        
        fetch(urlApp, { method: 'POST', body: new URLSearchParams(obj) })
        .then(() => { alert("✅ Saída cravada na mesma linha!"); abrirSaida(); });
    }
</script>
</body>
</html>
