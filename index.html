<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romaneio Digital - Farmax</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; margin: 0; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 5px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        #btnGPS { background-color: #17a2b8; margin-top: 5px; }
        #btnEnviar { background-color: #28a745; }
        #travaSeguranca { background-color: #ffeb3b; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 2px solid #fd7e14; }
        #btnTrava { background-color: #dc3545; font-size: 18px; }
        #avisoOffline { background-color: #ff9800; color: white; padding: 10px; text-align: center; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
        .escondido { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Vistoria Digital</h2>

    <div id="avisoOffline" class="escondido">
        ⚠️ Sem internet. Romaneios salvos no celular: <span id="contadorOffline">0</span>. O envio será automático quando o sinal voltar.
    </div>

    <div id="travaSeguranca">
        <h3 style="margin-top:0; color:#dc3545;">ATENÇÃO</h3>
        <p><strong>O veículo está TOTALMENTE imobilizado, calçado e com motor desligado?</strong></p>
        <button id="btnTrava" onclick="liberarApp()">SIM, CONFIRMO</button>
    </div>

    <form id="formRomaneio" class="escondido" onsubmit="processarFormulario(event)">
        <label>Empresa</label>
        <input type="text" id="empresa" placeholder="Ex: Farmax ou Nome da Terceirizada" required>

        <label>Portaria</label>
        <select id="portaria">
            <option value="P1">Portaria 1</option>
            <option value="P2">Portaria 2</option>
            <option value="P3">Portaria 3</option>
            <option value="Tanques">Área dos Tanques</option>
        </select>

        <label>Tipo de Veículo</label>
        <select id="tipoVeiculo">
            <option value="Pequeno">Veículo Pequeno</option>
            <option value="Carreta">Caminhão / Carreta</option>
        </select>

        <label>Nome do Motorista</label>
        <input type="text" id="motorista" placeholder="Nome Completo">

        <label>Localização GPS (Obrigatório)</label>
        <input type="text" id="localizacao" placeholder="Aguardando GPS..." readonly required>
        <button type="button" id="btnGPS" onclick="capturarGPS()">📍 Pegar Minha Localização</button>

        <button type="submit" id="btnEnviar">🚀 ENVIAR PARA A CHEFIA</button>
        <p id="statusEnvio" style="text-align:center; font-weight:bold; color:green; margin-top:15px;"></p>
    </form>
</div>

<script>
    const urlApp = "https://script.google.com/macros/s/AKfycbwTO-g1IoAk9KD8sO4t3aIxOl6KUhYJwyjIsYZsXxqnGNX7iT2XwwEEW90UISsjqDmG/exec";

    function liberarApp() {
        document.getElementById('travaSeguranca').classList.add('escondido');
        document.getElementById('formRomaneio').classList.remove('escondido');
        capturarGPS();
        atualizarPainelOffline();
    }

    function capturarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('localizacao').value = position.coords.latitude + ", " + position.coords.longitude;
                },
                () => alert("Libera o GPS aí! O sistema precisa da localização.")
            );
        }
    }

    function processarFormulario(event) {
        event.preventDefault();
        
        const hoje = new Date();
        const romaneio = {
            empresa: document.getElementById('empresa').value,
            portaria: document.getElementById('portaria').value,
            tipoVeiculo: document.getElementById('tipoVeiculo').value,
            motorista: document.getElementById('motorista').value,
            localizacao: document.getElementById('localizacao').value,
            vigia: "Daniel",
            dataEntrada: hoje.toLocaleDateString('pt-BR'),
            horaEntrada: hoje.toLocaleTimeString('pt-BR')
        };

        if (navigator.onLine) {
            enviarProGoogle(romaneio, true);
        } else {
            salvarOffline(romaneio);
        }
    }

    function enviarProGoogle(romaneio, limparFormulario) {
        if(limparFormulario) {
            document.getElementById('btnEnviar').innerText = "Enviando... ⏳";
            document.getElementById('btnEnviar').disabled = true;
        }

        const dados = new URLSearchParams(romaneio);

        fetch(urlApp, { method: 'POST', body: dados })
        .then(() => {
            if(limparFormulario) {
                document.getElementById('statusEnvio').innerText = "Romaneio na mesa do Diego! ✅";
                document.getElementById('btnEnviar').innerText = "🚀 ENVIAR PARA A CHEFIA";
                document.getElementById('btnEnviar').disabled = false;
                document.getElementById('formRomaneio').reset();
            }
        })
        .catch(() => salvarOffline(romaneio)); // Se der erro no fetch, salva no celular
    }

    function salvarOffline(romaneio) {
        let fila = JSON.parse(localStorage.getItem('romaneiosPendentes')) || [];
        fila.push(romaneio);
        localStorage.setItem('romaneiosPendentes', JSON.stringify(fila));
        
        document.getElementById('statusEnvio').innerText = "Sem sinal! Salvo no celular. 📱";
        document.getElementById('btnEnviar').innerText = "🚀 ENVIAR PARA A CHEFIA";
        document.getElementById('btnEnviar').disabled = false;
        document.getElementById('formRomaneio').reset();
        atualizarPainelOffline();
    }

    function sincronizarPendentes() {
        let fila = JSON.parse(localStorage.getItem('romaneiosPendentes')) || [];
        if (fila.length > 0) {
            fila.forEach(romaneio => enviarProGoogle(romaneio, false));
            localStorage.removeItem('romaneiosPendentes'); // Limpa a fila após atirar tudo
            atualizarPainelOffline();
            document.getElementById('statusEnvio').innerText = "Sinal voltou! Dados sincronizados. 🔄";
        }
    }

    function atualizarPainelOffline() {
        let fila = JSON.parse(localStorage.getItem('romaneiosPendentes')) || [];
        const aviso = document.getElementById('avisoOffline');
        if (fila.length > 0 || !navigator.onLine) {
            aviso.classList.remove('escondido');
            document.getElementById('contadorOffline').innerText = fila.length;
        } else {
            aviso.classList.add('escondido');
        }
    }

    // Fica de tocaia esperando a internet voltar
    window.addEventListener('online', sincronizarPendentes);
    window.addEventListener('offline', atualizarPainelOffline);
</script>

</body>
</html>
